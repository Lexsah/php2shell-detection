; php2shell-detection — temporary mitigation for CVE-2026-109618 / CVE-2026-109619
; Disables PHP session upload-progress tracking until an official patched PHP build is deployed.
; Drop into your SAPI's conf.d directory (see README), then restart php-fpm / Apache.
; session.upload_progress.enabled is PHP_INI_PERDIR: it can NOT be changed with ini_set()
; at runtime, so it must be set here, in the FPM pool, in Apache config, or in .user.ini.
session.upload_progress.enabled = Off
; Defence in depth: if something re-enables it, at least wipe progress data ASAP.
session.upload_progress.cleanup = On
