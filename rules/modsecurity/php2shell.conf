# php2shell-detection — ModSecurity v2/v3 rules (DETECTION ONLY: pass,log)
# CVE-2026-109618 / CVE-2026-109619 — PHP session.upload_progress
# Requires SecRequestBodyAccess On for the body rules.
# To block instead, replace "pass" with "deny,status:403" after a tuning period.

SecRule REQUEST_HEADERS:User-Agent "@contains php2shell" \
    "id:9109618,phase:1,pass,log,auditlog,t:none,t:lowercase,\
    msg:'php2shell tooling User-Agent (CVE-2026-109618/CVE-2026-109619)',\
    tag:'CVE-2026-109618',tag:'CVE-2026-109619',tag:'php2shell',severity:'CRITICAL'"

SecRule REQUEST_HEADERS:Content-Type "@beginsWith multipart/form-data" \
    "id:9109619,phase:2,pass,log,auditlog,t:none,t:lowercase,chain,\
    msg:'Multipart request carrying PHP_SESSION_UPLOAD_PROGRESS field (CVE-2026-109618/CVE-2026-109619)',\
    tag:'CVE-2026-109618',tag:'CVE-2026-109619',tag:'php2shell',severity:'WARNING'"
    SecRule ARGS_POST_NAMES|ARGS_NAMES "@streq php_session_upload_progress" "t:none,t:lowercase"

SecRule REQUEST_HEADERS:Content-Type "@beginsWith multipart/form-data" \
    "id:9109620,phase:2,pass,log,auditlog,t:none,t:lowercase,chain,\
    msg:'Raw multipart body references PHP_SESSION_UPLOAD_PROGRESS (fallback) (CVE-2026-109618/CVE-2026-109619)',\
    tag:'CVE-2026-109618',tag:'CVE-2026-109619',tag:'php2shell',severity:'WARNING'"
    SecRule MULTIPART_PART_HEADERS|REQUEST_BODY "@rx (?i)name=\"?php_session_upload_progress" "t:none"
